name: Build
on:
  push:
    branches: [main, 'development/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 scripts/setup-minecolonies.py
      - run: ./gradlew --no-daemon --max-workers=2 build
      - run: python3 scripts/test-lifecycle.py
      - uses: actions/upload-artifact@v4
        with:
          name: kingdomsofminecraft-development
          path: build/libs/*.jar
          if-no-files-found: error
