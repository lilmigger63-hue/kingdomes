name: Verified milestone release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    permissions:
      contents: read
      deployments: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 scripts/setup-minecolonies.py
      - run: ./gradlew --no-daemon --max-workers=2 build
      - run: python3 scripts/test-lifecycle.py
      - name: Require repository release approval configuration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          protected=$(gh api "repos/$GITHUB_REPOSITORY/environments/milestone-release" --jq 'any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length) > 0)')
          test "$protected" = true
      - name: Check recorded milestone acceptance
        run: python3 scripts/verify-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: build/libs/*.jar
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: milestone-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: artifacts
      - name: Publish new release without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" artifacts/*.jar
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "Kingdoms of Minecraft $GITHUB_REF_NAME"
          --notes-file RELEASE_NOTES.md --prerelease
