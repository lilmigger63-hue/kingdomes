name: Core contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: ./scripts/test-core.sh
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
